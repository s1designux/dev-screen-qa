<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>규정 시험 화면 — 일부러 두 군데 어긋남</title>
<style>
  /* ===== dev-ok.html 과 같은 화면에 결함 두 개만 심었다. =====
     ❌ 결함1: 뱃지 배경 #0072CE → #0073CF (토큰 밖 색, 가장 가까운 토큰은 --color-brand-blue #0072CE)
     ❌ 결함2: 으뜸 버튼 높이 44 → 41 (정본 Button PC md 규격 44). 클래스는 .primary-button — s1-btn 이 아니다.
     나머지는 모두 토큰 안의 값이다. 규정 대조는 이 둘만 잡아야 한다. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F5F6FB; color: #353535; font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; font-size: 16px; font-weight: 400; }
  .app { width: 1440px; }
  .header { height: 64px; padding: 0 24px; background: #FFFFFF; border-bottom: 1px solid #D9D9D9;
            display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 18px; font-weight: 700; color: #1D6CEB; }
  .badge { height: 28px; padding: 0 12px; display: flex; align-items: center; border-radius: 4px;
           background: #0073CF;   /* ❌ 결함1: 토큰 밖 색 */
           color: #FFFFFF; font-size: 12px; font-weight: 500; }
  .main { padding: 24px; }
  .title { font-size: 24px; font-weight: 700; color: #000000; margin-bottom: 24px; }
  .stats { display: flex; gap: 16px; }
  .card { flex: 1; background: #FFFFFF; border: 1px solid #D9D9D9; border-radius: 10px; padding: 16px; }
  .card .label { font-size: 14px; color: #757575; }
  .card .value { font-size: 24px; font-weight: 700; color: #353535; margin-top: 8px; }
  .footer { margin-top: 24px; display: flex; gap: 12px; }
  .primary-button { height: 41px;   /* ❌ 결함2: 규격 44 */
                    min-width: 80px; padding: 0 16px; background: #1D6CEB; color: #FFFFFF;
                    border: 1px solid #1D6CEB; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .secondary-button { height: 44px; min-width: 80px; padding: 0 16px; background: #FFFFFF; color: #353535;
                      border: 1px solid #D9D9D9; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">MyDashboard</div>
      <div class="badge">NEW</div>
    </header>
    <main class="main">
      <h1 class="title">관리자 대시보드</h1>
      <section class="stats">
        <div class="card"><div class="label">방문자</div><div class="value">9,873</div></div>
        <div class="card"><div class="label">신규 가입</div><div class="value">982</div></div>
        <div class="card"><div class="label">전환율</div><div class="value">2.1%</div></div>
      </section>
      <div class="footer">
        <button class="primary-button">보고서 내보내기</button>
        <button class="secondary-button">취소</button>
      </div>
    </main>
  </div>
</body>
</html>
