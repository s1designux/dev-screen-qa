# ── 웹 이름표 한 장 ──────────────────────────────────────────────
# PC 웹 화면을 찍을 때 쓴다. 폰을 꽂을 필요가 없어 윈도우 PC에서 그대로 돈다.
#   윈도우:  찍기.bat apps\웹-예시.yaml
#   맥   :  ./run.sh apps/웹-예시.yaml

앱이름: 유비스 관리자
플랫폼: web
서비스코드: UV            # 사진 이름 앞자리 → UV-WEB-001@default.png
기본주소: https://dev.example.com    # 화면마다 뒷부분만 적으면 된다
화면폭: 1440              # 브라우저 창 너비(px). 세로는 페이지 전체가 통짜로 찍힌다
기다림: 1.5               # 화면이 다 그려지기를 기다리는 초
로그인: 없음               # 시험 계정 이름(apps/앱사전.json 에 적어 둔 것)

# 찍을 화면 목록.
#   번호 : 포털 화면번호 (세 자리)
#   이름 : 사람이 알아보는 이름
#   주소 : 기본주소 뒤에 붙는 부분. 다른 사이트면 https:// 째로 적는다
#   상태 : 같은 화면의 다른 모습 (default / empty / error …)
#   동작 : 찍기 전에 할 일. 앱과 같은 말을 쓴다
#          탭 · 있으면탭 · 입력 칸=값 · 기다림 2 · 스크롤 · 뒤로 · 지우기  (→ 로 잇는다)
화면:
  - 번호: "001"
    이름: 로그인
    주소: /login
    상태: default

  - 번호: "001"
    이름: 로그인
    주소: /login
    상태: error
    동작: 입력 아이디=없는아이디 → 입력 비밀번호=1234 → 탭 로그인 → 기다림 2

  - 번호: "002"
    이름: 대시보드
    주소: /dashboard
    상태: default
