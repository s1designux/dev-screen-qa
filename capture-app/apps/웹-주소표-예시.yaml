# ── 웹 주소표 한 장 ──────────────────────────────────────────────
# 포털이 내려준 촬영요청.json(디자인 기준 TC)에 '개발 주소'만 이어 주는 표다.
# 무엇을 찍을지는 디자인이 정하고, 어디서 찍을지는 이 표가 정한다.
#
#   윈도우:  웹TC.bat 촬영요청.json apps\웹-주소표-예시.yaml
#   맥   :  python3 lib/webtc.py 촬영요청.json apps/웹-주소표-예시.yaml

앱이름: 유비스 관리자
플랫폼: web
서비스코드: UV
기본주소: https://dev.example.com
화면폭: 1440
기다림: 1.5
로그인: 없음

# 디자인이름 : 포털 TC의 디자인 프레임 이름. 일부만 적어도 이어진다.
# 주소       : 기본주소 뒤에 붙는 부분. 다른 사이트면 https:// 째로.
# 동작       : 그 상태를 만들기 위해 할 일 (앱과 같은 말)
#              탭 · 있으면탭 · 입력 칸=값 · 기다림 2 · 스크롤 · 뒤로 · 지우기  (→ 로 잇는다)
화면:
  - 번호: "001"
    이름: 로그인
    디자인이름: 웹_로그인 화면_기본
    주소: /login

  - 번호: "002"
    이름: 로그인 오류
    디자인이름: 웹_로그인 화면_오류
    주소: /login
    상태: error
    동작: 입력 아이디=없는아이디 → 입력 비밀번호=1234 → 탭 로그인 → 기다림 2
