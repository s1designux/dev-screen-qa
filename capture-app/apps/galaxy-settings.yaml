# ── 앱 이름표 한 장 ───────────────────────────────────────────────
# 새 앱을 찍고 싶으면 이 파일을 복사해서 이 한 장만 새로 쓴다.
# 대본(flows/)은 손대지 않는다.

앱이름: 갤럭시 설정
플랫폼: android          # android / ios / web (지금은 android만 찍힌다)
앱주소: com.android.settings   # 안드로이드 앱의 속이름(개발자에게 물으면 알려준다)
서비스코드: SET           # 사진 이름 앞자리 → SET-AND-002@default.png
로그인: 없음              # 로그인이 필요하면 쓸 계정 이름을 적는다(다음 조각에서 씀)

# 찍을 화면 목록.
#   번호   : 포털 화면번호 (세 자리)
#   이름   : 사람이 알아보는 이름
#   상태   : 같은 화면의 다른 모습 (default / empty / error …)
#   누를것 : 첫 화면에서 눌러 들어갈 메뉴 글자. 첫 화면 자체면 - 로 둔다.
화면:
  - 번호: "001"
    이름: 설정 홈
    상태: default
    누를것: -
  - 번호: "002"
    이름: 연결
    상태: default
    누를것: 연결
  - 번호: "003"
    이름: 알림
    상태: default
    누를것: 알림
  - 번호: "004"
    이름: 디스플레이
    상태: default
    누를것: 디스플레이
  - 번호: "005"
    이름: 배터리
    상태: default
    누를것: 배터리
  - 번호: "006"
    이름: 애플리케이션
    상태: default
    누를것: 애플리케이션
