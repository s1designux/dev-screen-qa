<style>
  :root { --gray-50:#F5F5F5; --gray-100:#E9E9E9; --gray-200:#D9D9D9; --gray-500:#757575;
          --gray-800:#353535; --blue-400:#1D6CEB; --red-400:#E50533; --orange-500:#EA580C; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Apple SD Gothic Neo",sans-serif; margin:0; padding:14px;
         color:var(--gray-800); font-size:12px;
         min-height:100vh; display:flex; flex-direction:column; }
  .아래 { margin-top:auto; }        /* 단추 묶음은 언제나 맨 아래 */
  h1 { font-size:13px; margin:0 0 4px; }
  .sub { color:var(--gray-500); margin-bottom:10px; line-height:1.6; }
  .list { border:1px solid var(--gray-200); border-radius:4px; max-height:250px; overflow:auto; }
  .row { display:flex; flex-wrap:wrap; gap:4px 8px; padding:7px 10px; border-bottom:1px solid var(--gray-100); align-items:center; }
  .row:last-child { border-bottom:none; }
  .row .n { color:var(--gray-500); width:18px; }
  .row .t { flex:1; word-break:break-all; }
  .row .d { color:var(--gray-500); white-space:nowrap; }
  .row.warn .d { color:var(--red-400); }
  .row .where { flex-basis:100%; display:flex; gap:6px; align-items:center; padding-left:26px; color:var(--gray-500); }
  .row .where.hit { color:var(--orange-500); }
  .empty { padding:22px 10px; text-align:center; color:var(--gray-500); }
  button { width:100%; margin-top:8px; padding:10px; font-size:13px; font-weight:600;
           border:none; border-radius:4px; background:var(--blue-400); color:#fff; cursor:pointer;
           font-family:inherit; }
  button:disabled { background:var(--gray-100); color:#C4C4C4; cursor:not-allowed; }
  button.line { background:#fff; color:var(--gray-800); border:1px solid var(--gray-200);
                font-weight:500; margin-top:8px; }
  button.line:hover { background:var(--gray-50); }
  button.swap { background:var(--orange-500); }
  button.swap:disabled { background:var(--gray-100); color:#C4C4C4; }
  .말 { margin-top:10px; text-align:center; color:var(--gray-500); min-height:16px; line-height:1.6; }
  .말.bad { color:var(--red-400); }
  .말.ok { color:#12864e; }
  .말 a { color:var(--blue-400); cursor:pointer; text-decoration:underline; }
  .hint { margin-top:6px; color:var(--gray-500); font-size:11px; line-height:1.5; }
  .갈래제목 { margin:12px 0 5px; font-size:12px; font-weight:600; }
  .갈래 { display:flex; gap:5px; }
  .갈래 label { flex:1; text-align:center; padding:7px 0; border:1px solid var(--gray-200);
                border-radius:4px; cursor:pointer; color:var(--gray-500); font-size:11px;
                white-space:nowrap; }
  .갈래 input { display:none; }
  .갈래 label:has(input:checked) { border-color:var(--gray-800); background:var(--gray-50);
                                   color:var(--gray-800); font-weight:600; }
  .폭줄 { margin-top:6px; color:var(--gray-500); font-size:11px; min-height:16px; }
  .폭줄.mix { color:var(--orange-500); }
</style>

<h1>디자인 원본 인식</h1>
<div class="list" id="목록"><div class="empty">검수할 화면을 선택해 주세요.</div></div>
<div class="갈래제목">유형</div>
<div class="갈래" id="갈래">
  <label><input type="radio" name="갈래" value="web">PC 웹</label>
  <label><input type="radio" name="갈래" value="mobile-web">모바일 웹</label>
  <label><input type="radio" name="갈래" value="android">앱</label>
  <label><input type="radio" name="갈래" value="pcapp">PC S/W</label>
</div>
<div class="폭줄" id="폭줄"></div>
<div class="말" id="말"></div>
<div class="아래">
  <button id="보내기" disabled>보내기</button>
  <button id="사이트" class="line">자동캡쳐 사이트 열기 ↗</button>
</div>

<script>
  var 포털 = 'http://localhost:8765';       // Figma는 http 주소로 localhost만 허용한다(127.0.0.1은 manifest 오류)          // 검수 포털(내 PC). 꺼져 있으면 '검수 시안 바꾸기'는 조용히 숨긴다.
  var 화면들 = [], 파일열쇠 = '', 파일이름 = '';
  var 짝 = {};                                   // 프레임 id → 검수 화면 uuid (사람이 고른 값)
  var 선택지 = [];                               // 포털의 검수 화면 목록 [{page,label,url}]
  var 말 = document.getElementById('말');
  var 단추 = document.getElementById('보내기');
  var 갈래칸 = document.getElementById('갈래');
  var 폭줄 = document.getElementById('폭줄');
  var 물어본차례 = 0;
  // 유형은 사람이 고른다(짐작하지 않는다). 고르기 전에는 보내기를 누를 수 없다.
  var 갈래 = '';                 // 'web' / 'mobile-web' / 'android' / 'pcapp'
  var 웹인가 = function () { return 갈래 === 'web' || 갈래 === 'mobile-web'; };
  // 유형마다 '이 폭이면 너무 넓다'가 다르다 (lib/매체.py 의 시안폭경고 와 같은 값).
  // PC 웹·PC S/W 는 1920 이 정상이라 짚지 않는다. 유형을 고르기 전에는 짐작하지 않는다.
  var 폭경고 = { 'web': 0, 'mobile-web': 1400, 'android': 1400, 'pcapp': 0 };
  var 너무넓은가 = function (폭) { var 기준 = 폭경고[갈래] || 0; return 기준 > 0 && 폭 >= 기준; };

  function 갈래그리기(){
    Array.prototype.forEach.call(갈래칸.querySelectorAll('input'), function (i) {
      i.checked = (i.value === 갈래);
    });
    if (!갈래) {
      폭줄.className = '폭줄';
      폭줄.textContent = 화면들.length ? '어떤 화면인지 먼저 골라 주세요.' : '';
    } else if (!웹인가()) {
      폭줄.className = '폭줄'; 폭줄.textContent = '폭은 기기·창이 정합니다';
    } else if (!화면들.length) {
      폭줄.className = '폭줄'; 폭줄.textContent = '찍을 폭은 고른 시안의 폭을 그대로 씁니다';
    } else {
      var 폭들 = [];
      화면들.forEach(function (f) { if (폭들.indexOf(f.폭) < 0) 폭들.push(f.폭); });
      if (폭들.length === 1) {
        폭줄.className = '폭줄';
        폭줄.textContent = '찍을 폭 ' + 폭들[0] + ' (시안과 같게)';
      } else {
        폭줄.className = '폭줄 mix';
        폭줄.textContent = '시안 폭이 섞여 있어요 (' + 폭들.join('·') + ') — 화면마다 그 폭으로 찍습니다';
      }
    }
    단추그리기();
  }

  function 단추그리기(){
    단추.disabled = !화면들.length || !갈래;   // 화면과 유형이 둘 다 있어야 보낸다
  }

  function 대표폭(){
    return 화면들.length ? 화면들[0].폭 : 0;
  }

  Array.prototype.forEach.call(갈래칸.querySelectorAll('input'), function (i) {
    i.onchange = function () { 갈래 = i.value; 그리기(); };   // 유형이 바뀌면 폭 경고 기준도 바뀐다
  });

  function 그리기() {
    var el = document.getElementById('목록');
    if (!화면들.length) {
      el.innerHTML = '<div class="empty">검수할 화면을 선택해 주세요.</div>';
      갈래그리기();
      return;
    }
    el.innerHTML = 화면들.map(function (f, i) {
      var 넓음 = 너무넓은가(f.폭);           // 기준은 고른 유형이 정한다
      var where = '';
      if (선택지.length) {
        // 고르게 하지 않는다 — 검수 화면이 있으면(같은 프레임이거나 이름이 같으면) 그 화면 시안을 덮어쓴다.
        where = 짝[f.id] ? '<span class="where hit">검수 시안 변경</span>'
                         : '<span class="where">검수 화면 없음 → 촬영 준비로</span>';
      }
      return '<div class="row' + (넓음 ? ' warn' : '') + '"><span class="n">' + (i + 1) +
             '</span><span class="t">' + f.이름.replace(/</g, '&lt;') + '</span><span class="d">' +
             f.폭 + '×' + f.높이 + (넓음 ? ' ⚠︎' : '') + '</span>' + where + '</div>';
    }).join('');
    갈래그리기();
  }

  function 포털에묻기() {
    // 고른 프레임마다 검수 화면이 있는지. 포털이 꺼져 있으면 조용히 넘어간다.
    var 차례 = ++물어본차례;
    if (!화면들.length) { 선택지 = []; 짝 = {}; 그리기(); return; }
    fetch(포털 + '/api/frames', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileKey: 파일열쇠, fileName: 파일이름, frames: 화면들.map(function (f) { return { id: f.id, name: f.이름 }; }) })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (차례 !== 물어본차례) return;
      선택지 = j.options || []; 짝 = {};
      (j.frames || []).forEach(function (f) { if (f.match) 짝[f.id] = f.match.page; });
      그리기();
    }).catch(function () { if (차례 !== 물어본차례) return; 선택지 = []; 짝 = {}; 그리기(); });
  }

  function base64(bytes) {
    var u = new Uint8Array(bytes), s = '', 덩이 = 0x8000;
    for (var i = 0; i < u.length; i += 덩이) s += String.fromCharCode.apply(null, u.subarray(i, i + 덩이));
    return btoa(s);
  }

  var 바꾼것 = [], 바꾸기실패 = [], 남은것 = [];
  onmessage = function (e) {
    var m = e.data.pluginMessage;
    if (!m) return;

    if (m.갈래 === '고른것') {
      화면들 = m.화면들; 파일열쇠 = m.파일열쇠 || ''; 파일이름 = m.파일이름 || '';
      말.textContent = ''; 말.className = '말';
      그리기(); 포털에묻기();
    }

    if (m.갈래 === '진행') {
      말.className = '말';
      말.textContent = '그림 뜨는 중… ' + m.지금 + '/' + m.전부;
    }

    if (m.갈래 === '알림') { 말.className = '말 bad'; 말.textContent = m.글; }

    if (m.갈래 === '검수부치기') {
      if (m.실패) { 바꾸기실패.push(m.실패); if (m.마지막) 바꾸기끝(); return; }
      var 프레임 = m.프레임; 프레임.png = base64(프레임.png);
      fetch(포털 + '/api/design', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileKey: 파일열쇠, fileName: 파일이름, page: m.page, frame: 프레임 })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.error) 바꾸기실패.push(j.error); else 바꾼것.push({ name: 프레임.name });
        if (m.마지막) 바꾸기끝();
      }).catch(function () { 바꾸기실패.push('포털이 꺼져 있어요.'); if (m.마지막) 바꾸기끝(); });
    }

    if (m.갈래 === '부치기') {
      fetch('http://localhost:8767/pick', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(m.꾸러미)
      }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        마무리(m.꾸러미.화면들.length + '개 보냈습니다. 촬영 준비 사이트에서 이어 하세요.', true);
      }).catch(function () {
        마무리('촬영 준비 사이트가 꺼져 있습니다. 사이트를 켜고 다시 눌러 주세요.', false);
      });
    }
  };

  function 마무리(글, 좋음) {
    단추그리기();
    if (바꾼것.length) { 바꾼말(글); return; }      // 시안도 바꿨으면 그것까지 함께 알린다
    말.className = 좋음 ? '말 ok' : '말 bad';
    말.textContent = 글;
  }

  // 바꾼 화면을 하나씩 늘어놓지 않는다 — 몇 개 바꿨는지만 말한다(river 2026-09-14).
  function 바꾼말(덧붙임) {
    말.className = 바꾼것.length ? '말 ok' : '말 bad';
    말.innerHTML = (바꾼것.length
        ? 바꾼것.length + '개 시안을 바꿨어요.'
        : '바꾸지 못했어요 — ' + (바꾸기실패[0] || '알 수 없는 이유'))
      + (바꾸기실패.length && 바꾼것.length ? '<br>못 바꾼 것 ' + 바꾸기실패.length + ': ' + 바꾸기실패[0] : '')
      + (덧붙임 ? '<br>' + 덧붙임 : '');
  }

  function 바꾸기끝() {
    포털에묻기();   // 이제 id로 찾히므로 목록을 다시 맞춘다
    if (남은것.length) { 촬영준비로(); return; }    // 검수 화면이 없던 것만 이어서 촬영 준비로
    단추그리기();
    바꾼말('');
  }

  function 촬영준비로() {
    말.className = '말'; 말.textContent = '그림 뜨는 중…';
    parent.postMessage({ pluginMessage: {
      갈래: '보내기', 플랫폼: 갈래, 찍을폭: 대표폭(),
      건너뛸: 화면들.filter(function (f) { return 짝[f.id]; }).map(function (f) { return f.id; })
    } }, '*');
  }

  document.getElementById('사이트').onclick = function () {
    parent.postMessage({ pluginMessage: { 갈래: '사이트열기' } }, '*');
  };

  // 단추는 하나다. 줄마다 적힌 대로 갈라 보낸다 —
  // 검수 화면이 있는 것은 그 시안을 덮어쓰고, 없는 것만 촬영 준비로 보낸다.
  단추.onclick = function () {
    단추.disabled = true;
    바꾼것 = []; 바꾸기실패 = [];
    var 바꿀것 = 화면들.filter(function (f) { return 짝[f.id]; })
                    .map(function (f) { return { id: f.id, page: 짝[f.id] }; });
    남은것 = 화면들.filter(function (f) { return !짝[f.id]; });
    if (바꿀것.length) {
      말.className = '말'; 말.textContent = '그림 뜨는 중…';
      parent.postMessage({ pluginMessage: { 갈래: '검수시안보내기', 대상: 바꿀것 } }, '*');
      return;
    }
    촬영준비로();
  };
</script>
