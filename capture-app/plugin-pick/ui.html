<!--
  검수 화면 보내기 — 플러그인 창.
  생김새는 전부 S-1 정본 부품(Select · Radio · Table · Checkbox · Button)이 정한다.
  부품 CSS·동작은 검수 포털이 내보내는 정본 받아 둔 것(/assets/)을 그대로 잇는다 — 여기서 다시 적지 않는다.
  여기 적는 것은 배치(간격·자리)뿐이고 값은 전부 토큰이다.
  차례: ① 프로젝트 → ② 유형 → ③ 인식된 화면 (river 확정 2026-09-30)
-->

<style>
  * { box-sizing:border-box; }
  /* 글꼴은 토큰이 없어 포털 화면과 같이 적는다(mvp0/project_view.py 선례 · 정본 부품도 Pretendard) */
  body { font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif; margin:0; padding:var(--spacing-16); min-height:100vh; display:flex; flex-direction:column;
         gap:var(--spacing-16); background:var(--color-bg-level-0); color:var(--color-text-body-primary); }
  .칸 { display:flex; flex-direction:column; gap:var(--spacing-8); }
  .칸머리 { display:flex; justify-content:space-between; align-items:baseline; gap:var(--spacing-8); }
  .칸이름 { color:var(--color-text-title-primary); }
  .덧 { color:var(--color-text-body-secondary); }
  .라디오줄 { display:flex; flex-wrap:wrap; gap:var(--spacing-8) var(--spacing-16); }
  .목록 { max-height:240px; overflow:auto; }
  .목록 td { vertical-align:middle; }
  .목록 .이름 { word-break:break-all; }
  .빈 { color:var(--color-text-body-secondary); padding:var(--spacing-20) 0; text-align:center; }
  .말 { color:var(--color-text-body-secondary); text-align:center; min-height:var(--spacing-16); }
  .말.bad { color:var(--color-text-state-caution); }
  /* DESIGN_SYSTEM_GAP: Toast — 가이드에 '비차단 알림은 토스트'라고만 있고 부품이 없다(§4 없음).
     토큰만으로 자리를 잡는다 — 흰 바탕 · 떠 있는 그림자 · 모달 모서리. 몇 초 뒤 스스로 사라진다. */
  .토스트 { position:fixed; left:var(--spacing-16); right:var(--spacing-16); bottom:calc(var(--spacing-16) * 4);
            padding:var(--spacing-12) var(--spacing-16); border-radius:var(--radius-modal-md);
            background:var(--color-bg-level-0); box-shadow:var(--shadow-raised);
            color:var(--color-text-body-primary); text-align:center; }
  .토스트.bad { color:var(--color-text-state-caution); }
  .아래 { margin-top:auto; display:flex; gap:var(--spacing-8); }
  .아래 > * { flex:1; }
  /* 정본 부품이 display 를 스스로 달고 있어 hidden 만으로는 안 사라진다(CLAUDE.md 21번 · 부품 함정) */
  [hidden] { display:none !important; }
</style>

<div class="칸">

<!-- 정본 부품 동작(고르개 여닫기·키보드). 포털이 꺼져 있으면 못 받는다 — 그때는 아래에서 알린다. -->
<script type="module">
  import { autoInit } from "http://localhost:8765/assets/js/s1/s1-ui.auto.js";
  window.s1켜기 = autoInit;
  (window.s1켤것 || []).forEach(function (el) { autoInit(el); });
  window.s1켤것 = [];
</script>

<script>
  var 포털 = 'http://localhost:8765';       // Figma는 http 주소로 localhost만 허용한다(127.0.0.1은 manifest 오류)
  var 촬영 = 'http://localhost:8767';
  var 화면들 = [], 파일열쇠 = '', 파일이름 = '';
  var 짝 = {};                                   // 프레임 id → 검수 화면 page (포털이 알려준 값)
  var 선택지 = [];                               // 포털의 검수 화면 목록 [{page,label,url}]
  var 과제들 = [];                               // 포털의 프로젝트 [{uuid,name,code}]
  var 과제 = '';                                 // 사람이 고른 프로젝트 — 기본은 '선택'(아무것도 안 고름)
  var 말 = document.getElementById('말');
  var 단추 = document.getElementById('보내기');
  var 이어단추 = document.getElementById('사이트');
  var 갈래칸 = document.getElementById('갈래');
  var 셈 = document.getElementById('셈');
  var 물어본차례 = 0;
  // 유형은 사람이 고른다(짐작하지 않는다).
  var 갈래 = '';                 // 'web' / 'mobile-web' / 'android' / 'pcapp'
  var 웹인가 = function () { return 갈래 === 'web' || 갈래 === 'mobile-web'; };

  // 읽힌 것은 모두 체크된 채로 시작하고 뺄 것은 사람이 푼다(river 2026-10-01 — 목록에 이름표는 달지 않는다).
  // 화면 너비 가르기는 찍을 창 너비(대표폭)를 화면에서 잡는 데만 쓴다. 값은 lib/매체.py 의 화면폭 과 같다.
  var 화면폭 = { 'web': [1920, 1440, 1280], 'pcapp': [1920, 1440, 1280], 'mobile-web': [360], 'android': [360] };
  var 팝업이름 = /팝업|모달|다이얼로그|얼럿|알럿|토스트|바텀\s*시트|popup|pop-up|modal|dialog|alert|toast|bottom\s*sheet/i;
  function 가르기(f) {
    var 폭들 = 화면폭[갈래] || [];
    if (폭들.some(function (w) { return Math.abs(f.폭 - w) <= 1; })) return '화면';
    if (팝업이름.test(f.이름 || '')) return '팝업';
    return '쪽지';
  }
  var 사람이정함 = {};             // 프레임 id → true/false. 사람이 누른 체크는 유형을 바꿔도 그대로 둔다.
  function 보내는가(f) { return f.id in 사람이정함 ? 사람이정함[f.id] : true; }
  function 고른화면() { return 준비됨() ? 화면들.filter(보내는가) : []; }
  function 준비됨() { return !!(과제 && 갈래); }   // 프로젝트와 유형을 골라야 화면 목록이 열린다

  function e(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function 켜기(el) {
    if (window.s1켜기) window.s1켜기(el);
    else (window.s1켤것 = window.s1켤것 || []).push(el);
  }

  // ── ① 프로젝트: 정본 Select (mvp0/s1.py 고르개 와 같은 뼈대) ─────────────
  function 과제그리기(알림) {
    var 자리 = document.getElementById('과제자리');
    var 줄 = 과제들.map(function (p) {
      var 이것 = p.uuid === 과제;
      return '<div data-s1-part="option" role="option" aria-selected="' + 이것 + '" tabindex="' + (이것 ? 0 : -1) +
             '" data-value="' + e(p.uuid) + '"><span data-s1-part="option-label">' + e(p.name) + '</span></div>';
    }).join('');
    var 고른 = 과제들.filter(function (p) { return p.uuid === 과제; })[0];
    자리.innerHTML =
      '<div data-s1-component="select" data-size="xsm" data-break="pc">' +
      '<button type="button" data-s1-part="trigger" id="과제-trigger" aria-haspopup="listbox" aria-expanded="false"' +
      ' data-filled="' + (고른 ? 'true' : 'false') + '"' + (과제들.length ? '' : ' disabled') + '>' +
      '<span data-s1-part="value">' + e(고른 ? 고른.name : '선택') + '</span>' +
      '<span data-s1-part="icon" aria-hidden="true"></span></button>' +
      '<div data-s1-part="panel" hidden>' +
      '<div data-s1-component="dropdown" data-type="text" data-size="xsm" role="listbox" aria-labelledby="과제-trigger">' +
      줄 + '</div></div></div>' +
      (알림 ? '<div class="덧 typo-body-12r">' + e(알림) + '</div>' : '');
    var 뿌리 = 자리.querySelector('[data-s1-component="select"]');
    뿌리.addEventListener('s1:select:change', function (ev) {
      var 값 = (ev.detail && ev.detail.value) || '';
      if (값 === 과제) return;
      과제 = 값; 보냈음 = false;
      그리기(); 포털에묻기();
    });
    켜기(자리);
  }

  function 과제받기() {
    fetch(포털 + '/api/projects').then(function (r) { return r.json(); }).then(function (j) {
      과제들 = j.projects || [];
      과제그리기(과제들.length ? '' : '포털에 프로젝트가 없습니다. 포털에서 먼저 만들어 주세요.');
    }).catch(function () {
      과제들 = [];
      과제그리기('검수 포털이 꺼져 있습니다. 포털을 켜고 플러그인을 다시 열어 주세요.');
    });
  }

  // ── ② 유형 ─────────────────────────────────────────────────────────────
  Array.prototype.forEach.call(갈래칸.querySelectorAll('input'), function (i) {
    i.onchange = function () { 갈래 = i.value; 그리기(); };   // 유형이 바뀌면 화면 너비 기준도 바뀐다
  });

  // 보내는 동안에는 두 단추 모두 잠근다. '검수 포털로 이동'은 다 보낸 뒤에야 열린다.
  var 보내는중 = false, 보냈음 = false;
  function 단추그리기() {
    단추.disabled = 보내는중 || !고른화면().length;
    이어단추.disabled = 보내는중 || !보냈음;
  }

  // 찍을 창 너비는 화면에서 잡는다 — 팝업 너비로 창을 열면 안 된다. 화면이 하나도 없을 때만 체크한 첫 것.
  function 대표폭() {
    var 고른 = 고른화면();
    var 화면 = 고른.filter(function (f) { return 가르기(f) === '화면'; });
    return 화면.length ? 화면[0].폭 : 고른.length ? 고른[0].폭 : 0;
  }

  // ── ③ 인식된 화면: 정본 Table + Checkbox + Chip ───────────────────────────
  function 그리기() {
    var el = document.getElementById('목록');
    var 보낼수 = 고른화면().length;
    셈.textContent = !준비됨() || !화면들.length ? ''
                   : 보낼수 === 화면들.length ? 화면들.length + '개' : 화면들.length + '개 중 ' + 보낼수 + '개';
    if (!준비됨()) {
      el.innerHTML = '<div class="빈 typo-body-12r">프로젝트와 유형을 고르면 선택한 화면이 보입니다.</div>';
    } else if (!화면들.length) {
      el.innerHTML = '<div class="빈 typo-body-12r">캔버스에서 검수할 화면을 선택해 주세요.</div>';
    } else {
      el.innerHTML =
        '<div class="목록" data-s1-component="table" data-size="xsm"><table data-s1-part="table"><thead><tr>' +
        '<th data-s1-part="header-cell" scope="col"><div data-s1-component="checkbox"><input data-s1-part="control"' +
        ' type="checkbox" id="전체" aria-label="전체 선택"' + (보낼수 === 화면들.length ? ' checked' : '') + '></div></th>' +
        '<th data-s1-part="header-cell" scope="col">화면</th>' +
        '<th data-s1-part="header-cell" scope="col">크기</th></tr></thead><tbody>' +
        화면들.map(function (f) {
          var 켬 = 보내는가(f);
          return '<tr data-s1-part="row">' +
            '<td data-s1-part="cell"><div data-s1-component="checkbox"><input data-s1-part="control" type="checkbox"' +
            ' aria-label="' + e(f.이름) + ' 보내기" data-id="' + e(f.id) + '"' + (켬 ? ' checked' : '') + '></div></td>' +
            '<td data-s1-part="cell"><div class="이름">' + e(f.이름) + '</div></td>' +
            '<td data-s1-part="cell">' + f.폭 + '×' + f.높이 + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      // 머리의 체크는 전체 켜기·끄기. 하나라도 빠져 있으면 풀린 채로 보인다(부분 선택은 정본에 없다).
      document.getElementById('전체').onchange = function () {
        var 켬 = this.checked;
        화면들.forEach(function (f) { 사람이정함[f.id] = 켬; });
        그리기();
      };
      Array.prototype.forEach.call(el.querySelectorAll('tbody input[type=checkbox]'), function (c) {
        c.onchange = function () { 사람이정함[c.getAttribute('data-id')] = c.checked; 그리기(); };
      });
    }
    단추그리기();
  }

  function 포털에묻기() {
    // 고른 프레임마다 이 프로젝트에 검수 화면이 있는지. 포털이 꺼져 있으면 조용히 넘어간다.
    var 차례 = ++물어본차례;
    if (!화면들.length || !과제) { 선택지 = []; 짝 = {}; 그리기(); return; }
    fetch(포털 + '/api/frames', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileKey: 파일열쇠, fileName: 파일이름, project: 과제, frames: 화면들.map(function (f) { return { id: f.id, name: f.이름 }; }) })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (차례 !== 물어본차례) return;
      선택지 = j.options || []; 짝 = {};
      (j.frames || []).forEach(function (f) { if (f.match) 짝[f.id] = f.match.page; });
      그리기();
    }).catch(function () { if (차례 !== 물어본차례) return; 선택지 = []; 짝 = {}; 그리기(); });
  }

  function base64(bytes) {
    var u = new Uint8Array(bytes), s = '', 덩이 = 0x8000;
    for (var i = 0; i < u.length; i += 덩이) s += String.fromCharCode.apply(null, u.subarray(i, i + 덩이));
    return btoa(s);
  }

  function 알리기(글, 갈) { 말.className = '말 typo-body-12r' + (갈 ? ' ' + 갈 : ''); 말.textContent = 글; }

  // 끝난 결과(보냄·실패)는 토스트로 띄운다. 진행 중 글줄은 위 '말' 자리에 둔다.
  var 토스트칸 = document.getElementById('토스트'), 토스트시계 = 0;
  function 토스트(글, 나쁨) {
    알리기('');
    토스트칸.className = '토스트 typo-body-14m' + (나쁨 ? ' bad' : '');
    토스트칸.innerHTML = 글;               // 부르는 쪽에서 막아 둔 글만 온다
    토스트칸.hidden = false;
    clearTimeout(토스트시계);
    토스트시계 = setTimeout(function () { 토스트칸.hidden = true; }, 나쁨 ? 5000 : 2500);
  }

  var 바꾼것 = [], 바꾸기실패 = [];
  onmessage = function (ev) {
    var m = ev.data.pluginMessage;
    if (!m) return;

    if (m.갈래 === '고른것') {
      화면들 = m.화면들; 파일열쇠 = m.파일열쇠 || ''; 파일이름 = m.파일이름 || '';
      알리기('');
      그리기(); 포털에묻기();
    }

    if (m.갈래 === '진행') 알리기('그림을 뜨는 중입니다… ' + m.지금 + '/' + m.전부);

    if (m.갈래 === '알림') { 보내는중 = false; 단추그리기(); 토스트(e(m.글), true); }

    if (m.갈래 === '검수부치기') {
      if (m.실패) { 바꾸기실패.push(m.실패); if (m.마지막) 바꾸기끝(); return; }
      var 프레임 = m.프레임; 프레임.png = base64(프레임.png);
      fetch(포털 + '/api/design', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileKey: 파일열쇠, fileName: 파일이름, project: 과제, page: m.page, frame: 프레임 })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.error) 바꾸기실패.push(j.error); else 바꾼것.push({ name: 프레임.name });
        if (m.마지막) 바꾸기끝();
      }).catch(function () { 바꾸기실패.push('포털이 꺼져 있습니다.'); if (m.마지막) 바꾸기끝(); });
    }

    if (m.갈래 === '부치기') {
      fetch(촬영 + '/pick', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(m.꾸러미)
      }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        마무리(m.꾸러미.화면들.length + '개를 보냈습니다. 검수 포털로 이동해 이어 합니다.', true);
      }).catch(function () {
        마무리('촬영 준비 사이트가 꺼져 있습니다. 사이트를 켜고 다시 눌러 주세요.', false);
      });
    }
  };

  function 마무리(글, 좋음) {
    보내는중 = false;
    if (좋음) 보냈음 = true;
    단추그리기();
    if (바꾼것.length) { 바꾼말(글); return; }      // 시안도 바꿨으면 그것까지 함께 알린다
    토스트(e(글), !좋음);
  }

  // 바꾼 화면을 하나씩 늘어놓지 않는다 — 몇 개 바꿨는지만 말한다(river 2026-09-14).
  function 바꾼말(덧붙임) {
    토스트((바꾼것.length
        ? 바꾼것.length + '개 시안을 바꿨습니다.'
        : '바꾸지 못했습니다. ' + e(바꾸기실패[0] || '알 수 없는 이유'))
      + (바꾸기실패.length && 바꾼것.length ? '<br>못 바꾼 것 ' + 바꾸기실패.length + ': ' + e(바꾸기실패[0]) : '')
      + (덧붙임 ? '<br>' + e(덧붙임) : ''), !바꾼것.length);
  }

  function 바꾸기끝() {
    포털에묻기();   // 이제 id로 찾히므로 목록을 다시 맞춘다
    촬영준비로();   // 바꾼 것까지 모두 촬영 준비로 이어 보낸다
  }

  // 체크한 것은 하나도 빼지 않고 촬영 준비로 보낸다 — 시안을 갈아끼운 화면도 다시 찍어야 한다(river 2026-09-14).
  // 고른 프로젝트를 함께 싣는다 — 촬영기가 그 프로젝트로 넘어가 그 아래로 접수한다.
  function 촬영준비로() {
    알리기('그림을 뜨는 중입니다…');
    var p = 과제들.filter(function (x) { return x.uuid === 과제; })[0] || {};
    parent.postMessage({ pluginMessage: {
      갈래: '보내기', 플랫폼: 갈래, 찍을폭: 대표폭(),
      보낼id: 고른화면().map(function (f) { return f.id; }),   // 체크한 것만
      과제: { uuid: 과제, 이름: p.name || '', 코드: p.code || '' }
    } }, '*');
  }

  // 포털의 '개발화면 촬영' 자리로 연다(촬영 준비 사이트는 거기 창으로 끼워 돈다).
  document.getElementById('사이트').onclick = function () {
    var 주소 = 과제 ? 포털 + '/project/' + 과제 + '?' + encodeURIComponent('메뉴') + '=capture' : '';
    parent.postMessage({ pluginMessage: { 갈래: '사이트열기', 주소: 주소 } }, '*');
  };

  // 단추는 하나다. 검수 화면이 있는 것은 그 시안을 먼저 덮어쓰고,
  // 그다음 체크한 것 **전부**(바꾼 것 포함)를 촬영 준비로 보낸다.
  단추.onclick = function () {
    보내는중 = true; 보냈음 = false;
    단추그리기();
    바꾼것 = []; 바꾸기실패 = [];
    var 바꿀것 = 고른화면().filter(function (f) { return 짝[f.id]; })
                    .map(function (f) { return { id: f.id, page: 짝[f.id] }; });
    if (바꿀것.length) {
      알리기('그림을 뜨는 중입니다…');
      parent.postMessage({ pluginMessage: { 갈래: '검수시안보내기', 대상: 바꿀것 } }, '*');
      return;
    }
    촬영준비로();
  };

  과제그리기('');
  과제받기();
  그리기();
</script>
